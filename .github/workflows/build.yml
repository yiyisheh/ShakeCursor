name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match version $version in Directory.Build.props"
          }

      - name: Test
        run: dotnet run --project tests -c Release

      - name: Build exe and MSI
        shell: pwsh
        run: ./build.ps1

      - name: Upload unsigned build
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ShakeCursor-${{ steps.version.outputs.version }}-unsigned
          path: |
            dist/ShakeCursor.exe
            dist/ShakeCursor.msi
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      # Signing runs once the SignPath repository variables are set; each request waits for manual approval in SignPath.
      - name: Sign with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          parameters: |
            version: "${{ needs.build.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 21000
          output-artifact-directory: dist

      - name: Use unsigned build
        if: vars.SIGNPATH_ORGANIZATION_ID == ''
        uses: actions/download-artifact@v8
        with:
          name: ShakeCursor-${{ needs.build.outputs.version }}-unsigned
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd dist
          sha256sum ShakeCursor.msi ShakeCursor.exe > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" ShakeCursor.msi ShakeCursor.exe SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "ShakeCursor $VERSION" --notes-from-tag
